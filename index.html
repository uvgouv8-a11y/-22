<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0a08">
<title>القناص – فلسفة ومنطق</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <img src="sniper.jpg" alt="القناص" class="hero-img">
  <div class="hero-shade"></div>
  <div class="hero-text">
    <span class="badge">أولى ثانوي</span>
    <h1>القناص</h1>
    <p>فلسفة ومنطق – الترم الأول</p>
  </div>
</header>

<main>
  <section id="tab-summaries" class="tab active">
    <div class="search"><input id="q" type="search" placeholder="ابحث في الملخصات..."></div>
    <div id="chips" class="chips"></div>
    <div id="summaries"></div>
  </section>

  <section id="tab-mindmap" class="tab">
    <div class="toolbar">
      <button id="expandAll">فتح الكل</button>
      <button id="collapseAll">طي الكل</button>
    </div>
    <div id="mindmap" class="mindmap"></div>
  </section>

  <section id="tab-ask" class="tab">
    <div class="ask-card">
      <img src="icon.png" alt="" class="ask-avatar">
      <h2>اسأل القناص</h2>
      <p>اكتب سؤالك واضغط إرسال، وهيتفتح الواتساب بالسؤال جاهز.</p>
      <form id="askForm">
        <textarea id="question" rows="5" placeholder="اكتب سؤالك هنا..." required></textarea>
        <button type="submit" class="send" aria-label="إرسال">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M2.5 21.5 23 12 2.5 2.5l-.01 7.4L16 12 2.49 14.1z"/></svg>
          <span>إرسال</span>
        </button>
      </form>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="summaries" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h5M9 12h5"/></svg><span>ملخصات</span></button>
  <button data-tab="mindmap">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="5" r="1.8"/><circle cx="19.5" cy="5" r="1.8"/><circle cx="4.5" cy="19" r="1.8"/><circle cx="19.5" cy="19" r="1.8"/><path d="M6 6.2l3.9 3.9M18 6.2l-3.9 3.9M6 17.8l3.9-3.9M18 17.8l-3.9-3.9"/></svg><span>خريطة ذهنية</span></button>
  <button data-tab="ask">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>اسأل القناص</span></button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
